<div class="max-w-5xl mx-auto p-4">
  <!-- TOP BAR -->
  <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
    <div>
      <h1 class="text-xl italic font-bold text-primary tracking-tight slide-in-left">
        Thông tin cá nhân
      </h1>
      <p class="text-sm text-gray-500 mt-1 slide-in-left">Quản lý hồ sơ và thông tin tài khoản</p>
    </div>

    <div class="flex items-center gap-2">
      @if (!isEditing()) {
        <app-button variant="primary" (btnClick)="onEdit()">
            <svg lucideIcon="pencil" size="14"></svg>
          Chỉnh sửa
        </app-button>
      } @else {
        <app-button variant="outline" (btnClick)="onCancel()">Hủy</app-button>
        <app-button variant="primary" (btnClick)="onSave()">
            <svg lucideIcon="save" size="14"></svg>
            Lưu thay đổi</app-button>
      }
    </div>
  </div>

  <!-- PROFILE CARD -->
  <div class="fade-in overflow-hidden border border-gray-200 bg-white shadow-sm rounded-lg">
    <!-- COVER -->
    <div class="relative h-48 overflow-hidden border-b border-gray-100 bg-primary/90">
      <div
        class="absolute inset-0 opacity-30 bg-cover bg-center"
        style="background-image: url('bg_card.png')"
      ></div>

      <div class="relative z-10 h-full flex items-end px-8 pb-6">
        <div class="flex items-end gap-6 flex-wrap">
          <!-- AVATAR: Sử dụng currentUser() để tránh cập nhật tức thời khi đang gõ -->
          <div class="relative group">
            <div
              class="size-28 rounded-full bg-primary text-white flex items-center justify-center text-3xl font-bold border-4 border-white shadow-lg shrink-0"
            >
              {{ currentUser().name | customName }}
            </div>
            
            @if (isEditing()) {
              <app-button
                variant="outline"
                size="icon"
                className="absolute bottom-0 right-0 bg-white shadow-md rounded-full!"
              >
                <svg lucideIcon="camera" size="14"></svg>
              </app-button>
            }
          </div>

          <div class="pb-2">
            <h2 class="text-2xl font-bold text-white tracking-tight">{{ currentUser().name }}</h2>
            <p class="text-sm text-white/90">{{ currentUser().email }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- BODY FORM -->
    <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- NAME -->
      <div class="space-y-2">
        <label for="userName" class="text-sm font-semibold text-gray-700">Họ và tên</label>
        <app-custom-input
          id="userName"
          [ngModel]="tempUser().name"
          (ngModelChange)="updateTempUser('name', $event)"
          [disabled]="!isEditing()"
          [class.bg-gray-50]="!isEditing()"
          variant="outline"
          placeholder="Nhập họ và tên"
        ></app-custom-input>
      </div>

      <!-- EMAIL -->
      <div class="space-y-2">
        <label for="userEmail" class="text-sm font-semibold text-gray-700">Email</label>
        <app-custom-input
          id="userEmail"
          [ngModel]="tempUser().email"
          (ngModelChange)="updateTempUser('email', $event)"
          [disabled]="!isEditing()"
          [class.bg-gray-50]="!isEditing()"
          variant="outline"
          placeholder="Nhập email"
        ></app-custom-input>
      </div>

      <!-- ROLE -->
      <div class="space-y-2">
        <label class="text-sm font-semibold text-gray-700">Vai trò</label>
        <div class="flex items-center h-10">
          <span
            [class]="currentUser().role === 'Quản lý' ? 'bg-orange-100 text-orange-600' : 'bg-blue-100 text-blue-600'"
            class="px-3 py-1 text-xs uppercase font-bold rounded"
          >
            {{ currentUser().role }}
          </span>
        </div>
      </div>

      <!-- STATUS -->
      <div class="space-y-2">
        <label class="text-sm font-semibold text-gray-700">Trạng thái</label>
        <div class="flex items-center gap-2 text-sm text-green-600 font-medium h-10">
          <span class="size-2 rounded-full bg-green-500 animate-pulse"></span>
          Đang hoạt động
        </div>
      </div>
    </div>
  </div>
</div>
