<div class="h-screen flex flex-col bg-gray-100">
  <!-- TOPBAR -->
  <div
    class="sticky top-0 z-50 flex items-center justify-between px-5 py-3 border-b border-gray-100 bg-white shadow-sm"
  >
    <!-- LEFT -->
    <div class="flex items-center gap-3">
      <app-button variant="outline" startIcon="arrow-left" (btnClick)="goBack()">
        Quay lại
      </app-button>

      <div>
        <h2 class="text-lg font-semibold text-primary">Thông tin bài đăng</h2>

        <p class="text-xs text-gray-500">Hiển thị thông tin chi tiết bài đăng</p>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="flex items-center gap-2">
      <!-- SAVE -->
      <app-button variant="primary" startIcon="pencil" (btnClick)="onEdit()">
        Chỉnh sửa
      </app-button>
    </div>
  </div>

  @if (displayUrl) {
    <iframe class="w-full h-full border-none bg-white" [src]="displayUrl"></iframe>
  }
</div>
