<aside class="flex flex-col h-screen w-72 bg-white border-r border-gray-200 shrink-0">
  <!-- Header -->
  <div class="px-3 py-5 items-center justify-center">
    <div class="flex items-start gap-3">
      <!-- Icon -->
      <div>
        <svg lucideIcon="blocks" [size]="25"></svg>
      </div>

      <!-- Text -->
      <div class="min-w-0">
        <h2 class="text-base font-bold text-gray-900 leading-none">Page Builder</h2>

        <p class="text-xs text-gray-400 mt-1 leading-relaxed">Chọn block để thêm vào trang</p>
      </div>
    </div>
  </div>

  <!-- Block library -->
  <div class="border-t border-gray-100 flex-1 overflow-y-auto px-3 py-4 flex flex-col gap-2">
    <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-widest px-1 mb-1">
      <svg lucideIcon="cuboid" class="w-5 h-5 inline-block mr-1"></svg>
      Blocks
    </p>

    @for (item of blockLibrary(); track item.type) {
      <app-button
        variant="action"
        type="button"
        (click)="onAddBlock(item.type)"
        className="w-full group"
      >
        <div class="flex items-start gap-3 w-full text-left">
          <!-- Icon -->
          <div
            class="shrink-0 mt-0.5 text-gray-500 group-hover:text-white transition-colors duration-200"
          >
            @if (item.icon) {
              <svg [lucideIcon]="item.icon" class="w-5 h-5"></svg>
            } @else {
              <svg lucideIcon="square" class="w-5 h-5"></svg>
            }
          </div>

          <!-- Content -->
          <div class="flex flex-col items-start min-w-0 gap-1">
            <span
              class="text-sm font-semibold text-gray-800 group-hover:text-white transition-colors duration-200"
            >
              {{ item.name }}
            </span>

            <span
              class="text-xs text-gray-400 leading-relaxed group-hover:text-white transition-colors duration-200"
            >
              {{ item.desc }}
            </span>
          </div>
        </div>
      </app-button>
    }
  </div>

  <!-- Actions -->
  <div class="px-3 py-4 border-t border-gray-100 flex flex-col gap-2">
    <app-button (click)="onOpenPreview()" variant="outline" className="w-full">
      <svg lucideIcon="eye"></svg>
      Xem trước
    </app-button>
    <app-button (click)="onSubmit()" variant="primary" className="w-full">
      <svg lucideIcon="save"></svg>
      Lưu trang
    </app-button>

    <app-button (click)="onClearPage()" variant="destructive" className="w-full">
      <svg lucideIcon="trash"></svg>
      Xóa trang
    </app-button>
  </div>
</aside>
