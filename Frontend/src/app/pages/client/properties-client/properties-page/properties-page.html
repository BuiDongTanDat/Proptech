<!-- Layout -->
<div class="min-h-screen pb-16 bg-slate-50/50">
  <!-- HERO BANNER SECTION -->
  <header class="relative bg-slate-950 text-white overflow-hidden pt-16 pb-24 md:pt-24 md:pb-32">
    <!-- Background Effect -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(59,130,246,0.08),transparent_45%)]"></div>
    <div class="absolute inset-0 bg-linear-to-t from-slate-950 via-slate-950/75 to-transparent"></div>

    <div class="fade-in transition duration-200 relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="max-w-2xl">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium bg-blue-500/10 text-blue-300 border border-blue-500/20 backdrop-blur-sm mb-4">
          <span class="size-1.5 rounded-full bg-blue-400 animate-pulse" aria-hidden="true"></span>
          Dự án nổi bật 
        </span>
        <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold tracking-tight leading-tight mb-3">
          Khám phá <span class="text-blue-400">Dự Án</span> <br class="hidden sm:inline" />
          & Cơ Hội Đầu Tư
        </h1>
        <p class="text-slate-300 text-xs md:text-sm max-w-lg leading-relaxed">
          Cập nhật nhanh chóng, chính xác các dự án bất động sản nổi bật, cơ hội đầu tư tiềm năng và các hoạt động nổi bật của chúng tôi.
        </p>
      </div>
    </div>
  </header>

  <!-- MODERN OVERLAPPING SEARCH BAR -->
  <div class="fade-in transition duration-200  relative z-20 -mt-10 md:-mt-12 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/80 border border-slate-100 p-3 sm:p-4">
      <form (submit)="$event.preventDefault(); store.searchPublic()" class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
        <!-- Input wrapper -->
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.602 10.602z" />
            </svg>
          </div>
          <input
            type="text"
            [ngModel]="store.searchQuery()"
            (ngModelChange)="store.setSearch($event)"
            name="search"
            placeholder="Nhập tên dự án, khu vực hoặc từ khóa cần tìm..."
            class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border-0 focus:bg-white text-slate-800 placeholder-slate-400 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-hidden transition-all duration-200"
          />
        </div>

        <!-- Search Button -->
        <button
          type="submit"
          class="px-7 py-3.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm rounded-xl transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer shadow-md shadow-blue-500/10 hover:shadow-lg hover:shadow-blue-500/25"
        >
          <span>Tìm kiếm</span>
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN CONTENT SECTION -->
  <main class="w-full max-w-7xl mx-auto px-4 md:px-10 py-12">
    <!-- Header Row -->
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-4 gap-4">
      <div>
        <h2 class="text-2xl md:text-3xl text-primary font-semibold">Các dự án nổi bật</h2>
        <p class="text-xs text-gray-400 mt-1">Hiển thị {{ posts().length }} dự án bất động sản.</p>
      </div>
    </div>

    <hr class="my-6 text-gray-200" />

    <!-- Card list retains its original parameters -->
    <app-properties-list
      [properties]="posts()"
      [loading]="loading()"
      [keyword]="store.searchQuery()"
      (keywordChange)="store.setSearch($event)"
      (search)="store.searchPublic()"
    >
    </app-properties-list>

    <div class="flex items-center justify-center gap-3 mt-12 pb-8">
      <app-pagination
        [currentPage]="store.currentPage()"
        [totalPages]="store.totalPages()"
        [maxVisible]="5"
        (pageChange)="onPageChange($event)"
        class="mt-6 flex justify-center"
      >
      </app-pagination>
    </div>
  </main>
</div>
