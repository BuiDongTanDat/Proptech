<!-- Layout -->
<div class="min-h-screen">
  <div class="flex flex-col md:flex-row items-start">
    <!-- Sidebar -->
    <div class="w-full md:w-auto">
      <app-properties-sidebar
        [filters]="filters()"
        [categories]="categories()"
        [selectedCategory]="selectedCategory()"
        (locationChange)="onLocationChange($event)"
        (developerChange)="onDeveloperChange($event)"
        (categoryChange)="onCategoryChange($event)"
      ></app-properties-sidebar>
    </div>

    <!-- Main Content -->
    <main class="flex-1 w-full px-4 md:px-10 py-8">
      <!-- Header Row -->
      <div class="flex flex-col md:flex-row md:items-end justify-between mb-4 gap-4">
        <div>
          <h2 class="text-3xl md:text-4xl text-primary">Các dự án nổi bật</h2>
          <p class="text-xs text-gray-400 mt-1">
            Hiển thị {{ filteredProperties().length }} dự án bất động sản.
          </p>
        </div>

        <div class="flex items-center gap-2">
          <span class="text-[10px] uppercase text-gray-400">Danh mục</span>
          <div class="relative">
            <app-dropdown
              [ngModel]="selectedCategory()"
              (ngModelChange)="onCategoryChange($event)"
              [options]="categoryOptions()"
              placeholder="Chọn danh mục"
              className="min-w-36 text-xs"
            ></app-dropdown>
          </div>
          <span class="text-[10px] uppercase text-gray-400">Sắp xếp</span>
          <div class="relative">
            <app-dropdown
              [ngModel]="selectedSort()"
              (ngModelChange)="onSortChange($event)"
              [options]="sortOptions"
              placeholder="Sắp xếp"
              className="min-w-36 text-xs"
            ></app-dropdown>
          </div>
        </div>
      </div>

      <hr class="my-6 text-gray-200" />

      <!-- List -->
      <app-properties-list class="overflow-y-auto" [properties]="pagedProperties()">
      </app-properties-list>

      <!-- ===== PHÂN TRANG (PAGINATION) ===== -->
      <div class="flex items-center justify-center gap-3 mt-12 pb-8">
        <app-pagination
          [currentPage]="currentPage()"
          [totalPages]="totalPages"
          [maxVisible]="5"
          (pageChange)="onPageChange($event)"
        ></app-pagination>
      </div>
    </main>
  </div>
</div>
