<aside class="w-full md:w-64 border-b md:border-b-0 md:border-r border-gray-200 px-6 py-8 overflow-y-auto ">
	<!-- Logo -->
	<div class="mb-8">
		<h1 class="text-xl text-primary font-bold"> Tuyển chọn </h1>
		<p class="text-xs uppercase text-gray-400 mt-0.5">Bộ lọc tìm kiếm</p>
	</div>

	<!-- Vị trí -->
	<div class="mb-6">
		<label class="block text-xs uppercase text-gray-400 mb-2">Vị trí</label>
		<app-custom-input variant="outline" type="text" placeholder="Nhập khu vực hoặc thành phố..."
			(input)="onLocationChange($any($event.target).value)"></app-custom-input>
	</div>

	<!-- Chủ đầu tư -->
	<div class="mb-6">
		<label class="block text-xs uppercase text-gray-400 mb-2">Chủ đầu tư</label>
		<app-custom-input variant="outline" type="text" placeholder="Nhập tên chủ đầu tư..."
			(input)="onDeveloperChange($any($event.target).value)"></app-custom-input>
	</div>

	<!-- Danh mục dự án -->
	<div class="mb-6">
		<label class="block text-xs uppercase text-gray-400 mb-2">Danh mục</label>
		<select
			class="w-full border rounded px-2 py-1 text-sm"
			[value]="selectedCategory"
			(change)="onCategoryChange($any($event.target).value)"
		>
			<option value="all">Tất cả</option>
			<option *ngFor="let cat of categories" [value]="cat._id">{{ cat.name }}</option>
		</select>
	</div>
</aside>
