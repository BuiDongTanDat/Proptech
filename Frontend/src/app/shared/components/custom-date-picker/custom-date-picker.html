<div class="relative w-full custom-date-picker">
  @if (label) {
    <label class="mb-1 block text-sm font-medium text-gray-700">
      {{ label }}
    </label>
  }

  <div class="relative">
    <input
      #dateInput
      type="date"
      [value]="value"
      [disabled]="disabled"
      (input)="onDateChange($event)"
      (blur)="onTouched()"
      (click)="dateInput.showPicker()"
      class="
      hover:border-primary
      w-full rounded-sm border border-gray-200 bg-white px-3 py-2 pr-10 text-sm text-gray-800 outline-none transition focus:border-primary disabled:bg-gray-100 disabled:cursor-not-allowed
      [&::-webkit-calendar-picker-indicator]:opacity-0
      [&::-webkit-calendar-picker-indicator]:absolute
      [&::-webkit-calendar-picker-indicator]:w-full
      [&::-webkit-calendar-picker-indicator]:h-full
      [&::-webkit-calendar-picker-indicator]:cursor-pointer"
    />

    <svg
      lucideIcon="calendar"
      class="absolute right-3 top-1/2 -translate-y-1/2 size-4 text-gray-400 pointer-events-none"
    ></svg>
  </div>
</div>
