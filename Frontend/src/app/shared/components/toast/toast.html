@if (visible()) {
<div class=" fixed bottom-5 right-5 z-50 flex items-start gap-3 px-4 py-3 rounded-sm shadow-lg min-w-64 max-w-sm fade-in transition duration-150"
    [class]="config.bg">
    <svg [lucideIcon]="config.icon" class="size-5 shrink-0"></svg>

    <div class="flex flex-col gap-0.5">

        <span class="text-xs opacity-80">
            {{ message() }}
        </span>
    </div>
</div>
}
