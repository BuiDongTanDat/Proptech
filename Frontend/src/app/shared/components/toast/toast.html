@if (toast.visible) {
<div
  class="fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg min-w-64 max-w-sm fade-in transition-all duration-200"
  [class]="config.bg"
>
  <svg
    [lucideIcon]="config.icon"
    class="size-5 shrink-0 self-center"
  ></svg>

  <span class="text-xs leading-none flex items-center">
    {{ toast.message }}
  </span>
</div>
}
